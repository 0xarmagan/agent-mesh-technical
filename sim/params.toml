# EEZ mechanism sim — parameters. INTERNAL. Model, not measurement.
# Every value carries a tag:
#   code@<sha>      read from source
#   measured@<sha>  Foundry gas run against that commit (see sim/calibration/)
#   assumed         placeholder; change freely, never quote externally

source_commit = "143d87e"

# ── M1: batch gas calibration (tx-level, steady state, empty batch, --isolate) ──
# Fitted from calibration/empty_batch_RxP.json: gas = a + b·R + c·P + d·R·P
# (every rollup lists all P proof systems, so Σ|I_r| = R·P). Mock verifier.
[m1.calibration]
file = "calibration/empty_batch_RxP.json"
tag = "measured@143d87e"

[m1.verify]                         # cold call to IProofSystem.verify, gas
mock = { gas = 2535, tag = "measured@143d87e" }
ecdsa = { gas = 6191, tag = "measured@143d87e" }
groth16 = { gas = 250000, tag = "assumed" }
stark = { gas = 1000000, tag = "assumed" }

# Per-unit body gas, steady state (GasBreakdown / GasExecPaths, mock verifier).
# Body gas excludes the extra calldata bytes of the unit.
[m1.unit_gas]
deferred_entry = { gas = 32723, tag = "measured@143d87e", src = "bench.post.deferred.extra_bare_entry" }
inline_entry = { gas = 20671, tag = "measured@143d87e", src = "bench.post.inline.extra_bare_entry" }
static_entry = { gas = 29006, tag = "measured@143d87e", src = "bench.post.static.extra_entry" }
l1_to_l2_record = { gas = 16005, tag = "measured@143d87e", src = "bench.post.deferred.extra_l1_to_l2_record" }
l2_to_l1_record = { gas = 13318, tag = "measured@143d87e", src = "bench.post.deferred.extra_l2_to_l1_record" }
extra_rollup_update = { gas = 8704, tag = "measured@143d87e", src = "bench.post.extra_rollup_update" }
return_byte = { gas = 71.8, tag = "measured@143d87e", src = "(return_bytes.4096 - return_bytes.0)/4096" }
execute_l1_to_l2 = { gas = 55306, tag = "measured@143d87e", src = "bench.execute.l1_to_l2.no_callback" }
first_callback = { gas = 24780, tag = "measured@143d87e", src = "bench.execute.l1_to_l2.first_callback" }

[m1.calldata]
# Per deferred entry with one L1→L2 record: 832 bytes (calibration/deferred_entry_calldata.json)
zero_bytes_per_entry = { value = 686, tag = "measured@143d87e" }
nonzero_bytes_per_entry = { value = 146, tag = "measured@143d87e" }
gas_per_zero_byte = { value = 4, tag = "code@EIP-2028" }
gas_per_nonzero_byte = { value = 16, tag = "code@EIP-2028" }
# EIP-7623 floor (10 gas/token, token = zero + 4·nonzero) not binding: ~12.7k vs ~53.8k per entry
file = "calibration/deferred_entry_calldata.json"

[m1.sweep]
rollups = [1, 2, 4, 8]
proof_systems = [1, 2, 4]
verifier = ["ecdsa", "groth16"]
gas_price_gwei = [1, 5, 20, 50]     # tag = "assumed"

# ── M2: security ──
# Costs are in arbitrary units (assumed-illustrative). Only RATIOS and the binding
# component are meaningful outputs. Never convert to USD in external material.
[m2]
tag = "assumed"

[[m2.component]]                    # shared or per-rollup keys/parties
id = "eez_upgrade_owner"
cost = 1000
shared = true

[[m2.component]]
id = "ps_ecdsa_A"                   # signer key
cost = 100
owner = "ps_owner_A"                # setSigner (ECDSAProofSystem.sol:51)
shared = true

[[m2.component]]
id = "ps_owner_A"
cost = 150
shared = true

[[m2.component]]
id = "ps_ecdsa_B"
cost = 100
owner = "ps_owner_B"
shared = true

[[m2.component]]
id = "ps_owner_B"
cost = 150
shared = true

[[m2.component]]
id = "ps_zk_C"                      # hypothetical ZK prover (does not exist @143d87e)
cost = 5000
owner = "ps_owner_C"
shared = true

[[m2.component]]
id = "ps_owner_C"
cost = 800
shared = true

[[m2.rollup]]
id = "zone_ref_1of1"
contract = "reference"              # Rollup.sol policy applies
threshold = 1
proof_systems = ["ps_ecdsa_A"]
owner_cost = 200                    # setRoot / setThreshold / vkeys, no timelock (Rollup.sol:225-268)
proxy_admin_cost = 300
var = 400

[[m2.rollup]]
id = "zone_ref_2of2"
contract = "reference"
threshold = 2
proof_systems = ["ps_ecdsa_A", "ps_ecdsa_B"]
owner_cost = 2000
proxy_admin_cost = 2000
var = 400

[[m2.rollup]]
id = "zone_ref_t0"
contract = "reference"
threshold = 0                       # behaves as 1: ≥1 PS index (EEZ.sol:553)
proof_systems = ["ps_ecdsa_B"]
owner_cost = 2000
proxy_admin_cost = 2000
var = 100

[[m2.rollup]]
id = "zone_zk_owner_timelocked"
contract = "reference"
threshold = 1
proof_systems = ["ps_zk_C"]
owner_cost = 4000
proxy_admin_cost = 4000
var = 600

[[m2.rollup]]
id = "zone_custom"
contract = "custom"                 # own IRollupContract policy (EEZ.sol:684-689)
code_cost = 50                      # cost to exploit/abuse its own vkey policy
threshold = 1
proof_systems = ["ps_ecdsa_A"]
owner_cost = 2000
proxy_admin_cost = 2000
var = 200
